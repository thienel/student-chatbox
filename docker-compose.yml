services:
  postgres:
    image: postgres:16-alpine
    container_name: educhat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: educhat
      POSTGRES_USER: educhat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educhat -d educhat"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: educhat_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set}

  langchain:
    build:
      context: ./langchain
      dockerfile: Dockerfile
    container_name: educhat_langchain
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_FLASHCARD_MODEL: ${OPENAI_FLASHCARD_MODEL:-gpt-4o-mini}
      OPENAI_EXAM_MODEL: ${OPENAI_EXAM_MODEL:-gpt-4o-mini}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?AI_SERVICE_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      NESTJS_URL: http://backend:3000/api/v1
      PORT: 8000
    volumes:
      - uploads_data:/app/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: educhat_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      langchain:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://educhat:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/educhat
      AI_SERVICE_URL: http://langchain:8000
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?AI_SERVICE_SECRET must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_REFRESH_EXPIRES: 7d
      PORT: 3000
      # development enables TypeORM synchronize (auto-migrate schema) and
      # secure:false cookies so auth works over plain HTTP (IP deployment).
      NODE_ENV: development
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 50
      UPLOAD_TMP_DIR: /app/uploads/tmp
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Demo users created on startup when SEED_DEMO_DATA=true (idempotent).
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@educhat.local}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_LECTURER_EMAIL: ${DEMO_LECTURER_EMAIL:-lecturer@educhat.local}
      DEMO_LECTURER_PASSWORD: ${DEMO_LECTURER_PASSWORD:-}
      DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:-student@educhat.local}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: educhat_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
